:root[data-theme="dark"]{--bg:#101914;--surface:#18241C;--surface2:#213027;--fg:#E8EEE6;--muted:#9AA89E;--line:#2C3B31;--green:#7CC48F;--gsoft:#1F3A29;--goldsoft:#3A3217;--bad:#EE8A7B;--badbg:#3E1E19;--sky:#173244;--skyfg:#8CCBEA;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;margin:0;padding-left:16px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 100px}
.wrap{max-width:760px;margin:0 auto}
.hero{position:relative;color:#fff;margin:0 -16px;padding:16px 20px 58px;border-radius:0 0 24px 24px;background:#1F5130;background:linear-gradient(155deg,#1F5130 0%,#2E7D4F 62%,#4FA36A 100%)}
.hero:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;background:radial-gradient(circle at 92% 8%,rgba(242,182,50,.42) 0 62px,transparent 63px),radial-gradient(circle at 4% 78%,rgba(63,156,196,.40) 0 48px,transparent 49px),radial-gradient(circle at 78% 92%,rgba(242,140,107,.35) 0 34px,transparent 35px)}
.hero>*{position:relative}.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:11px;background:#fff}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.k{font-size:11px;letter-spacing:.14em;font-weight:800;color:#F2B632;margin-top:16px;text-transform:uppercase}
h1{font-size:26px;line-height:1.12;margin:5px 0 4px;font-weight:800;text-wrap:balance}.hero p{margin:0;font-size:13px;opacity:.92}
.st{display:flex;margin:-34px -4px 0;position:relative}.sc{flex:1;min-width:0;margin:0 4px;border-radius:15px;padding:11px;color:#fff;box-shadow:0 6px 14px rgba(20,40,25,.18)}
.sc b{display:block;font-size:21px;font-weight:800;overflow-wrap:anywhere}.sc span{font-size:11px;line-height:1.25;display:block}
.g{background:linear-gradient(160deg,#3A9460,#1F5130)}.y{background:linear-gradient(160deg,#F7C84E,#D98E10);color:#3B2A00}.b{background:linear-gradient(160deg,#52B0D8,#2573A0)}.c{background:linear-gradient(160deg,#F28C6B,#C4482A)}
main{padding-top:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;min-width:0}
h2{font-size:20px;margin:6px 0 10px;font-weight:800}h3{margin:0 0 8px;font-size:15px;font-weight:800}.sm{font-size:12.5px;color:var(--muted)}
.big{font-size:32px;font-weight:800;line-height:1}.gold{background:linear-gradient(135deg,#F9D46B,#E9A21C);color:#3B2A00;border:0}.gold .sm{color:#5a4200}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;margin-left:6px;vertical-align:middle}
.t1{background:var(--badbg);color:var(--bad)}.t2{background:var(--goldsoft);color:#7A5200}.t3{background:var(--gsoft);color:var(--green)}.t4{background:var(--sky);color:var(--skyfg)}
.nt{display:flex;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.nt:last-child{border:0;padding-bottom:0}.nt:first-of-type{padding-top:0}
.dot{width:34px;height:34px;border-radius:50%;flex:none;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nt b{font-size:14px}.nt>div:last-child{min-width:0;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--green);color:var(--surface);text-align:left;padding:7px;font-weight:600}td{padding:7px;border-bottom:1px solid var(--line)}tr.cur td{background:var(--goldsoft);font-weight:800}
.scroll{overflow-x:auto}
.bar{height:12px;background:var(--surface2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3A9460,#1F5130)}
label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;margin-top:4px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{font:800 15px Inter,sans-serif;background:var(--green);color:var(--surface);border:0;border-radius:99px;padding:12px 20px;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}.btn.sm2{padding:7px 14px;font-size:13px;margin-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:600 11px Inter,sans-serif;padding:7px 2px;border-radius:14px;margin:0 2px;cursor:pointer}.nav button.on{background:var(--goldsoft);color:var(--green)}
.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.lock{font-size:11px;background:var(--surface2);border-radius:99px;padding:3px 9px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;height:80px}.bars div{flex:1;margin:0 3px;border-radius:6px;background:#9CC3A3;min-height:4px}.bars div.loss{background:#F2B632}
.banner{background:var(--goldsoft);color:#7A5200;border-radius:12px;padding:9px 12px;font-size:13px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.code{font:800 24px/1 ui-monospace,monospace;letter-spacing:.12em;background:var(--surface2);border-radius:12px;padding:12px;text-align:center;user-select:all;margin:8px 0}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:9}
.link{border:0;background:none;color:var(--green);font:700 13px Inter,sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline}
tr.click{cursor:pointer}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:-34px -16px 0;padding:2px 16px 12px;position:relative;scrollbar-width:none;scroll-behavior:smooth}
.slides::-webkit-scrollbar{display:none}
.sl{flex:0 0 86%;scroll-snap-align:start;margin-right:10px;border-radius:20px;padding:14px 14px;display:flex;align-items:center;justify-content:space-between;color:#fff;min-height:108px;box-shadow:0 8px 18px rgba(20,40,25,.20)}
.sl:last-child{margin-right:0}
.sl img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:none;margin-left:12px;box-shadow:0 4px 10px rgba(0,0,0,.22)}
.slm{min-width:0}.slk{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.slx{font-size:15.5px;font-weight:800;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.sg{background:linear-gradient(135deg,#F7C84E,#D98E10);color:#3B2A00}.sb{background:linear-gradient(135deg,#52B0D8,#2573A0)}.sn{background:linear-gradient(135deg,#3A9460,#1F5130)}.sc{background:linear-gradient(135deg,#F28C6B,#C4482A)}
.dots{display:flex;justify-content:center;margin:0 0 6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);margin:0 3px;display:block}.dots i.on{background:#2E7D4F;width:20px;border-radius:5px}
.dots+.st{margin-top:6px}
@media(min-width:700px){.sl{flex-basis:46%}}

.lg{margin:0 -16px;padding-bottom:30px}
.lgtop{position:relative;overflow:hidden;text-align:center;color:#fff;padding:30px 24px 64px;border-radius:0 0 34px 34px;background:#1F5130;background:linear-gradient(155deg,#1F5130 0%,#2E7D4F 58%,#4FA36A 100%)}
.lga .lgtop{background:linear-gradient(155deg,#10301c 0%,#1F5130 60%,#2573A0 130%)}
.lgtop i{position:absolute;border-radius:50%;display:block}
.lgtop .b1{width:190px;height:190px;right:-60px;top:-50px;background:rgba(242,182,50,.35)}
.lgtop .b2{width:120px;height:120px;left:-40px;top:120px;background:rgba(63,156,196,.40)}
.lgtop .b3{width:80px;height:80px;right:30px;bottom:30px;background:rgba(242,140,107,.35)}
.lgtop>*:not(i){position:relative}
.lglogo{width:84px;height:84px;border-radius:22px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25);cursor:pointer;display:block;margin:0 auto}
.lgk{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#F7C84E}
.lgh{font-size:32px;line-height:1.1;margin:6px 0 8px;font-weight:800}
.lgs{margin:0 auto;font-size:14px;max-width:300px;opacity:.95}
.lgph{display:flex;justify-content:center;margin-top:18px}
.lgph img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin:0 -7px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.lgcard{position:relative;background:var(--surface);margin:-34px 16px 0;border-radius:26px;padding:20px 18px 20px;box-shadow:0 14px 34px rgba(20,40,25,.20)}
.lgcard h2{margin:0 0 4px;font-size:21px}
.lgcard input{border-radius:14px;padding:13px 14px;background:var(--bg)}
.lgcard input:focus{border-color:#F2B632;outline:none;box-shadow:0 0 0 3px rgba(242,182,50,.35)}
.eyeb{position:absolute;right:4px;top:8px;width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lgbtn{width:100%;margin-top:14px;border:0;border-radius:99px;padding:15px;font:800 17px Inter,sans-serif;color:#3B2A00;cursor:pointer;background:#F2B632;background:linear-gradient(135deg,#F9D46B,#E9A21C);box-shadow:0 8px 18px rgba(217,142,16,.35)}
.lgbtn:active{transform:translateY(1px)}
.lgch{display:flex;margin:18px 12px 0}
.lgch>div{flex:1;margin:0 4px;border-radius:18px;padding:12px 6px;text-align:center;color:#fff;box-shadow:0 6px 14px rgba(20,40,25,.15)}
.lgch b{display:block;font-size:24px;line-height:1.1}.lgch span{display:block;font-size:11.5px;font-weight:700;margin-top:4px;line-height:1.2}
.lgch .c1{background:linear-gradient(160deg,#F7C84E,#D98E10);color:#3B2A00}.lgch .c2{background:linear-gradient(160deg,#52B0D8,#2573A0)}.lgch .c3{background:linear-gradient(160deg,#F28C6B,#C4482A)}
.lgft{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
@media(min-width:700px){.lg{max-width:460px;margin:0 auto}.lgtop{border-radius:0 0 34px 34px}}

@media(max-width:420px){.f2{grid-template-columns:1fr}.sc b{font-size:18px}}
</style>

var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null}
function fmt(v,d){return v==null?'-':Number(v).toLocaleString('en-KE',{maximumFractionDigits:d==null?0:d})}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pdate(s){var p=String(s||'').split('-').map(Number);return p.length===3&&!p.some(isNaN)?new Date(p[0],p[1]-1,p[2]):null}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function dshow(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function daysBetween(a,b){return Math.round((b-a)/864e5)}
function planTotalKg(){var s=0;RATIO.forEach(function(r){if(r.t<=PLAN_WEEKS)s+=r.g*(r.t-r.f)*7});return s/1000}
function rowFor(ageDays){var w=ageDays/7;for(var i=0;i<RATIO.length;i++)if(w<RATIO[i].t)return RATIO[i];return RATIO[RATIO.length-1]}

function flockStats(gid,f){
  var L=LG(gid),days=((L.days||{})[f.id])||{},keys=Object.keys(days).sort();
  var dead=0,eaten=0;keys.forEach(function(k){dead+=days[k].deaths||0;eaten+=days[k].fed||0});
  var birds=f.birds||0,alive=Math.max(0,birds-dead);
  var hatch=pdate(f.hatch),age=hatch?daysBetween(hatch,today()):null;
  var need=birds*planTotalKg(),rem=Math.max(0,need-eaten);
  var wk=keys.filter(function(k){return days[k].avgW!=null});
  var lastW=wk.length?days[wk[wk.length-1]].avgW:null,prevW=wk.length>1?days[wk[wk.length-2]].avgW:null;
  var fcr=null;if(wk.length>1){var k0=wk[0],k1=wk[wk.length-1],fw=0;keys.forEach(function(k){if(k>k0&&k<=k1)fw+=days[k].fed||0});var gk=alive*(days[k1].avgW-days[k0].avgW)/1000;if(gk>0&&fw>0)fcr=fw/gk}
  var series=wk.slice(-5).map(function(k,i,a){var p=i>0?days[a[i-1]].avgW:(wk.length>a.length?days[wk[wk.length-a.length-1]].avgW:null);return{d:k,w:days[k].avgW,diff:p!=null?days[k].avgW-p:null}});
  return{days:days,keys:keys,dead:dead,alive:alive,birds:birds,age:age,eaten:eaten,need:need,rem:rem,lastW:lastW,diff:(lastW!=null&&prevW!=null)?lastW-prevW:null,fcr:fcr,series:series,loggedToday:!!days[iso(today())]}
}
function notices(gid,f,st){
  var out=[],t=today(),hatch=pdate(f.hatch);
  if(st.age==null)return[{i:'📅',c:'#FFF2C7',h:'Hatch date missing',x:'Ask Biashara Yangu to add the hatch date for '+esc(f.name)+'.'}];
  var r=rowFor(st.age),kg=st.alive*r.g/1000,och=kg*OCH[r.s]/100;
  out.push({i:'🌾',c:'#FFF2C7',h:'Feed now: '+fmt(kg,2)+' kg '+r.s+' mix',x:fmt(st.alive)+' birds x '+r.g+' g, in 2 meals of '+fmt(kg/2,2)+' kg. Ochongaa '+fmt(och*1000)+' g, maize meal '+fmt((kg-och)*1000)+' g.'});
  var end=STAGE_END[r.s];if(end){var nd=addDays(hatch,end*7),dl=daysBetween(t,nd),nx=r.s==='Starter'?'Grower':'Developer';out.push({i:'🔄',c:'#D6ECF6',h:'Next feed change: '+nx+(dl<=0?' (due now)':' in '+dl+' days'),x:'On '+dshow(nd)+' when birds are '+end+' weeks old.'})}
  var vacc=((LG(gid).vacc||{})[f.id])||{};
  VAC.forEach(function(v){if(vacc[v[1]])return;var due=addDays(hatch,v[0]),dl=daysBetween(t,due);
    if(dl<0&&dl>=-14)out.push({i:'💉',c:'#FDE0D6',h:v[1]+' is overdue',x:'Was due '+dshow(due)+'. Vaccinate now and tap Done on the Today tab.',vac:v[1],bad:1});
    else if(dl>=0&&dl<=7)out.push({i:'💉',c:'#FDE0D6',h:v[1]+(dl===0?' is due today':' in '+dl+' days'),x:dshow(due)+'. Collect the vaccine from the agrovet before then.',vac:v[1]})});
  if(!st.loggedToday)out.push({i:'📝',c:'#DFF0E4',h:'Record today',x:'Enter the feed given, a sample weight and any deaths.'});
  if(st.diff!=null&&st.diff<0)out.push({i:'⚠️',c:'#FDE0D6',h:'Weight dropped by '+fmt(-st.diff)+' g per bird',x:'Check water, feed quality, crowding and signs of disease.',bad:1});
  if(st.need>0&&st.rem/st.need<0.15)out.push({i:'🧺',c:'#FFF2C7',h:'Feed running low',x:'About '+fmt(st.rem,1)+' kg left in the plan. Prepare the next batch.'});

function adminRows(){
  var ids=Object.keys(S.store.groups).sort(function(a,b){return String(G(a).name).localeCompare(String(G(b).name))});
  return ids.map(function(id){
    var fl=FL(id),birds=0,rem=0,fcrs=[],last=null,warn=0;
    fl.forEach(function(f){var s=flockStats(id,f);birds+=s.alive;rem+=s.rem;if(s.fcr)fcrs.push(s.fcr);if(s.keys.length){var k=s.keys[s.keys.length-1];if(!last||k>last)last=k}});
    var dl=last?daysBetween(pdate(last),today()):null;
    return{id:id,g:G(id),m:members(id),r:registered(id),birds:birds,rem:rem,fcr:fcrs.length?fcrs.reduce(function(a,b){return a+b},0)/fcrs.length:null,dl:dl,hasFlock:fl.length>0}})}
function renderAdmin(){maybeMigrate();
  var rows=adminRows(),tm=0,tr=0,tb=0,att=0;
  rows.forEach(function(r){tm+=r.m||0;tr+=r.r||0;tb+=r.birds;if(r.hasFlock&&(r.dl==null||r.dl>3))att++});

function planImport(d){
  if(Array.isArray(d))d={groups:d};
  if(!d||typeof d!=='object')return null;
  var arr=function(k){return Array.isArray(d[k])?d[k]:[]},G0=arr('groups'),F=arr('flocks'),R=arr('records'),L=arr('ledger'),DD=arr('daily'),V=arr('vacc');
  var gid=function(x){return String(x==null?'':x).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40)},str=function(x,n){return String(x==null?'':x).slice(0,n)};
  var p={groups:{},flocks:{},logs:{},sk:{f:0,d:0,r:0,m:0},n:{g:0,f:0,d:0,v:0,m:0}},fg={};
  function lg(g){return p.logs[g]=p.logs[g]||{days:{},vacc:{},money:{}}}
  G0.forEach(function(g){if(!g||!g.id||!g.name)return;var id=gid(g.id);if(!id)return;p.groups[id]={name:str(g.name,80),ward:str(g.ward,60),contact:str(g.contact,60),phone:str(g.phone,20),members:num(g.members),registered:num(g.paid!=null?g.paid:g.registered),phase:num(g.phase)||0,hens:num(g.hens),cocks:num(g.cocks),chicks:num(g.chicks),lastVisit:str(g.lastVisit,10),notes:str(g.notes,200),imported:iso(today())};if(!S.store.groups[id])p.groups[id].active=true;p.n.g++});
  F.forEach(function(f){var g=f&&gid(f.groupId);if(!f||!f.id||!g||!p.groups[g]){p.sk.f++;return}var id=gid(f.id);(p.flocks[g]=p.flocks[g]||[]).push({id:id,name:str(f.name||'Flock',60),birds:num(f.count)||0,hatch:str(f.hatch,10),notes:str(f.notes,120)});fg[id]=g;p.n.f++});
  DD.forEach(function(x){var fid=x&&gid(x.flockId),g=fg[fid];if(!g||!x.date){p.sk.d++;return}var l=lg(g);(l.days[fid]=l.days[fid]||{})[x.date]={fed:num(x.fed),avgW:num(x.avgW),deaths:num(x.deaths)};p.n.d++});
  R.forEach(function(x){var fid=x&&gid(x.flockId),g=fg[fid];if(!g||!x.date){p.sk.r++;return}var l=lg(g),dd=(l.days[fid]=l.days[fid]||{}),e=dd[x.date];if(e){e.fed=(e.fed||0)+(num(x.feed)||0);e.deaths=(e.deaths||0)+(num(x.deaths)||0)}else dd[x.date]={fed:num(x.feed),avgW:null,deaths:num(x.deaths)};p.n.d++});
  V.forEach(function(x){var fid=x&&gid(x.flockId),g=fg[fid];if(!g||!x.name||!x.date)return;var l=lg(g);(l.vacc[fid]=l.vacc[fid]||{})[String(x.name)]=x.date;p.n.v++});
  L.forEach(function(x){var fid=x&&gid(x.flockId),g=fg[fid],id=x&&gid(x.id);if(!g||!x.date||!id){p.sk.m++;return}lg(g).money[id]={date:str(x.date,10),type:(x.type==='expense'&&(x.feedSrc==='commercial'||x.feedSrc==='local'))?x.feedSrc:'other',kind:x.type==='income'?'income':'expense',category:str(x.category,40),desc:str(x.desc,120),amount:num(x.amount)||0,kg:null};p.n.m++});
  if(!p.n.g)return null;

  p.sum='<b>Ready to import</b><div class="sm" style="margin:6px 0">'+p.n.g+' groups · '+p.n.f+' flocks · '+p.n.d+' daily records · '+p.n.v+' vaccinations · '+p.n.m+' money entries'+(skip.length?'<br>Left out: '+esc(skip.join(', ')):'')+'</div>';
  return p}
async function importNow(){var p=S.imp;if(!p||S.impBusy)return;S.impBusy=true;S.impMsg='';draw();

  }else if(tab==='ratio'){
    L.push(['Ochongaa','Lake Victoria shrimp meal, about 54% protein. It carries the protein in your mix.',3]);
    L.push(['Maize meal','The energy part of the mix. About 9% protein.',5]);
    L.push(['Aminovit premix','Add as on the pack label. It is counted inside the total weight.',4]);
    L.push(['Storage','Mix well, keep cool and dry, and use within 2 to 3 weeks.',2]);
  }else if(tab==='flock'){
    vc.slice(0,3).forEach(function(v,i){L.push(['Vaccination',vtxt(v),i%3])});
    L.push(['FCR target','Good indigenous chickens use about 2.5 to 3.0 kg of feed per kg gained.',2]);
    L.push(['Health','Weight dropping for two days? Check water, feed quality and crowding.',1]);
  }else{
    L.push(['Record everything','Enter every feed purchase the day you pay. Small amounts add up.',5]);
    L.push(['Compare','Check the cost per kg of commercial feed against your own mix.',4]);
    L.push(['Training fee','Registration is KSh 100 per member, paid to Biashara Yangu.',2]);
  }
  return L}
function slidesHtml(gid,f,st){
  var L=slideList(gid,f,st);if(!L.length)return '';
  return '<div class="slides" id="slides">'+L.map(function(x,i){return '<div class="sl '+SCOL[i%4]+'"><div class="slm"><div class="slk">'+esc(x[0])+'</div><div class="slx">'+esc(x[1])+'</div></div><img alt="" src="'+SP[x[2]%6]+'"></div>'}).join('')+'</div><div class="dots" id="dots">'+L.map(function(x,i){return '<i'+(i===0?' class="on"':'')+'></i>'}).join('')+'</div>'}
var slI=0;
function slGo(i){var t=document.getElementById('slides');if(!t||!t.children.length)return;slI=i%t.children.length;t.scrollLeft=t.children[slI].offsetLeft-t.children[0].offsetLeft}
setInterval(function(){var t=document.getElementById('slides');if(!t||document.hidden||Date.now()-(window.__slT||0)<8000)return;slGo(slI+1)},5000);
document.addEventListener('scroll',function(e){var t=e.target;if(!t||t.id!=='slides')return;var c=t.children;if(!c.length)return;var w=c[0].offsetWidth+10,i=Math.max(0,Math.min(c.length-1,Math.round(t.scrollLeft/w)));slI=i;var d=document.getElementById('dots');if(d)for(var k=0;k<d.children.length;k++)d.children[k].className=k===i?'on':''},true);
document.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('#slides'))window.__slT=Date.now()},true);
/* ---------- boot ---------- */
var auth=null;
function unsubAll(){S.unsubs.forEach(function(u){try{u()}catch(e){}});S.unsubs=[]}
function signOut(){S.welcomed=false;S.lrole=null;S.admode=false;unsubAll();S.role=null;S.gid=null;S.adminView=false;S.ready=false;S.err='';S.store={groups:{},flocks:{},logs:{},logins:{},contribs:{},money:{}};S.mrole=null;if(auth)auth.signOut()}
function sub(ref,store,single){var u=ref.onSnapshot(function(s){if(single){if(s.exists)S.store[store][s.id]=s.data();else delete S.store[store][s.id]}else{var o={};s.docs.forEach(function(d){o[d.id]=d.data()});S.store[store]=o}S.ready=true;clearTimeout(S.t);draw()},function(e){S.err=(e&&e.code==='permission-denied')?'This login has no access, or it has been switched off. Contact Biashara Yangu on 0740193141.':'Data error: '+(e&&e.message||'unknown');draw()});S.unsubs.push(u)}
function startAdmin(){S.role='admin';['groups','flocks','logs','logins','contribs','money'].forEach(function(c){sub(db.collection(c),c,false)});S.t=setTimeout(function(){if(!S.ready){S.msg='Still trying to reach the data. Check your internet.';draw()}},10000);draw()}
function startGroup(gid,mr){S.role='group';S.mrole=mr||'official';S.gid=gid;if(S.mrole!=='member')sub(db.doc('money/'+gid),'money',true);sub(mr==='member'?db.collection('contribs').where('email','==',me):db.collection('contribs').where('gid','==',gid),'contribs',false);if(S.mrole==='official')sub(db.collection('logins').where('gid','==',gid),'logins',false);['groups','flocks','logs'].forEach(function(c){sub(db.doc(c+'/'+gid),c,true)});S.ready=true;S.t=setTimeout(function(){S.msg='Still trying to reach your data.';draw()},10000);draw()}
document.addEventListener('submit',function(e){if(e.target.id!=='lf2')return;e.preventDefault();var em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;S.lerr='';
  auth.signInWithEmailAndPassword(em,pw).catch(function(x){var c=x&&x.code;S.lerr=(c==='auth/network-request-failed')?'No internet. You need internet to sign in.':(c==='auth/too-many-requests')?'Too many tries. Wait a few minutes and try again.':(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')?'Email or password is not right. If you are sure, check that this user exists in Firebase Authentication.':'Sign-in problem ('+(c||'unknown')+'). Tell Biashara Yangu support.';draw()})});
window.addEventListener('offline',function(){toast('You are offline. Records save and sync when the internet is back.')});
(function(){
  if(typeof firebase==='undefined'){S.err='The portal could not load. Open it once with internet, then it works with weak signal too.';draw();return}
  firebase.initializeApp(FBCFG);auth=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  auth.onAuthStateChanged(function(u){
    unsubAll();S.store={groups:{},flocks:{},logs:{},logins:{},contribs:{},money:{}};S.ready=false;S.err='';S.adminView=false;S.gid=null;S.nb='';
    if(!u){S.authed=false;S.role='login';S.ready=true;draw();return}
    S.admode=false;S.authed=true;me=(u.email||'').toLowerCase();
    if(me===ADMIN_EMAIL){startAdmin();return}
    db.doc('logins/'+me).get().then(function(p){if(p.exists&&p.data().gid&&p.data().active===false){S.err='This login has been switched off. Contact your group official.';draw()}else if(p.exists&&p.data().gid&&S.lrole&&S.lrole!==(p.data().role||'official')){var rr=p.data().role||'official';S.lrole=rr;S.lerr='This is a '+(rr==='member'?'Member':'Group Official')+' login, so we opened that sign-in. Please sign in again.';auth.signOut()}else if(p.exists&&p.data().gid){S.mname=p.data().name||'';S.welcomed=false;startGroup(p.data().gid,p.data().role)}else{S.err='This login is not linked to a group. Contact Biashara Yangu on 0740193141.';draw()}}).catch(function(e){S.err=(e&&e.code==='unavailable')?'No internet. Connect once to open your group.':'Could not open your group. '+(e&&e.message||'');draw()})});
})();
</script>
